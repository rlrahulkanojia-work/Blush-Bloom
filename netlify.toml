# Netlify configuration file for Blush & Bloom website

# Build settings
[build]
  publish = "/"  # The directory to publish (root in this case)

# Form handling settings
[build.processing.html]
  pretty_urls = false  # Disable pretty URLs to ensure .html extensions work

# Form success handling
[build.processing.forms]
  success_redirect = "/success.html"

# Headers to improve security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
